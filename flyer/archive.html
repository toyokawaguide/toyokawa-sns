<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月刊チラシ 号の一覧</title>
<script src="data/months.js"></script>
<style>
/* 紹介ページ（WordPress）に埋め込む「号の一覧」。毎月の自動更新で号が増えると、ここも自動で増える */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:#111;background:#fff;font-size:15px;line-height:1.6;padding:2px}
.latest{border:3px solid #e60012;border-radius:10px;padding:14px 16px;margin-bottom:18px;background:#fffbe0}
.latest .h{font-weight:900;color:#e60012;font-size:13px}
.latest .t{font-weight:900;font-size:22px;line-height:1.3;margin:2px 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns a{display:inline-block;text-decoration:none;font-weight:900;border-radius:30px;padding:9px 18px;border:2px solid #111;font-size:15px}
.btns a.main{background:#e60012;color:#fff}
.btns a.sub{background:#fff;color:#111}
h3{font-size:16px;font-weight:900;border-left:6px solid #0b2f7a;padding-left:8px;margin:18px 0 8px}
ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:8px}
li{border:2px solid #ddd;border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
li b{font-size:15px;white-space:nowrap}
li span{display:flex;gap:6px;flex:none}
li a{font-size:13px;font-weight:700;text-decoration:none;border:1.5px solid #0b2f7a;color:#0b2f7a;border-radius:20px;padding:3px 10px;white-space:nowrap}
li a.pdf{background:#0b2f7a;color:#fff}
.note{font-size:12px;color:#555;margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var MAKER = "https://toyokawaguide.github.io/toyokawa-sns/flyer/";   // ★★ 作成ページの場所
var ms = (window.FLYER_MONTHS || []).slice().reverse();
function lab(m){ var a = m.split("-"); return a[0] + "年" + (+a[1]) + "月号"; }
function pdf(m){ return MAKER + "pdf/flyer_" + m + ".pdf"; }
function view(m, i){ return i === 0 ? MAKER : MAKER + "?m=" + m; }
var h = "";
if (ms.length) {
  h += '<div class="latest"><div class="h">最新号</div><div class="t">' + lab(ms[0]) + '</div><div class="btns">'
     + '<a class="main" href="' + pdf(ms[0]) + '" target="_blank" rel="noopener">PDFで見る・ダウンロード</a>'
     + '<a class="sub" href="' + view(ms[0], 0) + '" target="_blank" rel="noopener">お店の宣伝を入れて印刷する</a></div></div>';
}
var years = {};
ms.forEach(function(m, i){ var y = m.slice(0, 4); (years[y] = years[y] || []).push([m, i]); });
Object.keys(years).sort().reverse().forEach(function(y){
  h += "<h3>" + y + "年</h3><ul>";
  years[y].forEach(function(p){
    h += "<li><b>" + lab(p[0]) + '</b><span><a class="pdf" href="' + pdf(p[0]) + '" target="_blank" rel="noopener">PDF</a>'
       + '<a href="' + view(p[0], p[1]) + '" target="_blank" rel="noopener">印刷ページ</a></span></li>';
  });
  h += "</ul>";
});
h += '<p class="note">※PDFは記事を全部のせた版です。「印刷ページ」では、お店の宣伝を入れたり、載せたくない記事を外したりして印刷できます。</p>';
document.getElementById("app").innerHTML = h;
// 埋め込み先（WordPress）に高さを知らせる
function tell(){ try { parent.postMessage({ flyerH: Math.ceil(document.getElementById("app").getBoundingClientRect().bottom) + 16 }, "*"); } catch (e) {} }
window.addEventListener("load", tell); window.addEventListener("resize", tell); tell();
</script>
</body>
</html>
