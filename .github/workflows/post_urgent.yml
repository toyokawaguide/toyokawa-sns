name: 🚨 緊急投稿（今すぐ公開・WP／Instagram／Threads）

# いつものライト記事と同じ準備（スプレッドシートに1行＋Driveに写真フォルダ）をしてから、
# GitHub アプリの Actions → このワークフロー → Run workflow で記事IDを入れて実行する。
#   - WP記事を「お知らせ」カテゴリで即公開（19時を待たない）
#   - Threads／Instagram フィード（写真があればカルーセル）／リール／ストーリーズ を投稿
#   - X 用テキストを Gmail で送る（X は社長が手動投稿）
# 中身は publish_light_article.py --now。失敗した媒体があれば赤になり、
# もう一度同じIDで実行すると成功済みの媒体はとばして失敗分だけやり直す。
on:
  workflow_dispatch:
    inputs:
      target_id:
        description: '記事ID（例: LR130・スプレッドシートのID列）'
        required: true
      mode:
        description: 'publish=今すぐ公開 / dry-run=投稿せず中身だけ確認（画像はArtifactsに保存）'
        type: choice
        options:
          - publish
          - dry-run
        default: 'publish'

concurrency:                 # 同じ記事を二重に走らせない（連打・再実行の重複防止）
  group: urgent-${{ github.event.inputs.target_id }}
  cancel-in-progress: false

jobs:
  urgent:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Reels動画のIG側処理待ちに余裕
    defaults:
      run:
        working-directory: light_articles/scripts
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: light_articles/scripts/requirements.txt

      - name: 日本語フォントセットアップ（GitHub Raw 直接DL）
        run: |
          FONT_DIR=/tmp/light_fonts
          mkdir -p "$FONT_DIR"
          BASE_URL="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Bold.ttc" "$BASE_URL/NotoSansCJK-Bold.ttc"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Regular.ttc" "$BASE_URL/NotoSansCJK-Regular.ttc"
          echo "LIGHT_FONT_DIR=$FONT_DIR" >> $GITHUB_ENV

      - name: ffmpeg セットアップ（プリインストール優先・apt-getフォールバック）
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: OAuth credentials 復元
        run: |
          echo "${{ secrets.LIGHT_GOOGLE_CREDENTIALS_B64 }}" | base64 -d > credentials.json
          mkdir -p _assets
          echo "${{ secrets.LIGHT_GOOGLE_TOKEN_B64 }}" | base64 -d > _assets/sheets_token.json

      - name: 緊急投稿 実行
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_ID: ${{ github.event.inputs.target_id }}
          MODE: ${{ github.event.inputs.mode }}
          PYTHONIOENCODING: utf-8
        run: |
          # IDは英数字だけ受け付ける（入力ミス・コマンド混入の防止）
          ID=$(echo "$TARGET_ID" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if ! echo "$ID" | grep -Eq '^[A-Z0-9_-]+$'; then
            echo "::error::記事IDの形式が不正です: '$TARGET_ID'"
            exit 1
          fi
          FLAGS="--id $ID --now"
          if [ "$MODE" = "publish" ]; then
            FLAGS="$FLAGS --publish"
          fi
          echo "実行コマンド: python publish_light_article.py $FLAGS"
          python publish_light_article.py $FLAGS

      - name: 生成物アーティファクト（dry-run時のみ）
        if: github.event.inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: urgent-preview-${{ github.run_id }}
          path: |
            light_articles/scripts/_sample/*.png
            light_articles/scripts/_sample/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 失敗通知（Gmail）
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_ID: ${{ github.event.inputs.target_id }}
        run: |
          python -c "
          import os, smtplib
          from email.mime.text import MIMEText
          body = ('緊急投稿（' + os.environ.get('TARGET_ID', '?') + '）で失敗がありました。\n'
                  '同じIDでもう一度実行すると、成功済みの媒体はとばして失敗分だけやり直します。\n\n'
                  'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = '[豊川ガイド] 緊急投稿 失敗あり（要確認）'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = os.environ['GMAIL_USER']
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          "
