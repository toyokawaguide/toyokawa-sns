name: 🚨 緊急告知（今すぐ公開・WP／Instagram／Threads）

# ライト記事とは別の仕組み（urgent/scripts/publish_urgent.py）。
# 専用スプレッドシート「緊急告知」タブに1行（ID／タイトル／本文）書いてから、
# GitHub アプリの Actions → このワークフロー → Run workflow で実行する。
#   - WP記事を「お知らせ」カテゴリで即公開（見出し【緊急告知】＋書いた本文だけ）
#   - Threads／Instagram フィード／リール／ストーリーズ を投稿（画像は「緊急告知」カードを自動生成）
#   - X 用テキストを Gmail で送る（X は社長が手動投稿）
# 失敗した媒体があれば赤になり、同じIDで再実行すると成功済みの媒体はとばして失敗分だけやり直す。
# 事前設定：Settings → Secrets and variables → Actions → Variables に URGENT_SPREADSHEET_ID（専用シートのID）
on:
  workflow_dispatch:
    inputs:
      target_id:
        description: 'ID（例: EM001）。空なら「状態」が空の1件を自動で選ぶ'
        required: false
      mode:
        description: 'publish=今すぐ公開 / dry-run=投稿せず中身だけ確認（画像はArtifactsに保存）'
        type: choice
        options:
          - publish
          - dry-run
        default: 'publish'

concurrency:                 # 連打・重複実行で二重投稿しない
  group: urgent-notice
  cancel-in-progress: false

jobs:
  urgent:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # リールのIG側処理待ちに余裕
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: light_articles/scripts/requirements.txt

      - name: 日本語フォントセットアップ（GitHub Raw 直接DL）
        run: |
          FONT_DIR=/tmp/light_fonts
          mkdir -p "$FONT_DIR"
          BASE_URL="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Bold.ttc" "$BASE_URL/NotoSansCJK-Bold.ttc"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Regular.ttc" "$BASE_URL/NotoSansCJK-Regular.ttc"
          echo "LIGHT_FONT_DIR=$FONT_DIR" >> $GITHUB_ENV

      - name: ffmpeg セットアップ（プリインストール優先・apt-getフォールバック）
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: ライブラリインストール
        run: pip install -r light_articles/scripts/requirements.txt

      - name: OAuth credentials 復元（Sheets はライト記事と同じGoogle認証を使う）
        working-directory: light_articles/scripts
        run: |
          echo "${{ secrets.LIGHT_GOOGLE_CREDENTIALS_B64 }}" | base64 -d > credentials.json
          mkdir -p _assets
          echo "${{ secrets.LIGHT_GOOGLE_TOKEN_B64 }}" | base64 -d > _assets/sheets_token.json

      - name: 緊急告知 実行
        working-directory: urgent/scripts
        env:
          URGENT_SPREADSHEET_ID: ${{ vars.URGENT_SPREADSHEET_ID }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_ID: ${{ github.event.inputs.target_id }}
          MODE: ${{ github.event.inputs.mode }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          ID=$(echo "$TARGET_ID" | tr -d '[:space:]')
          if [ -n "$ID" ]; then
            # IDは英数字だけ受け付ける（入力ミス・コマンド混入の防止）
            if ! echo "$ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "::error::IDの形式が不正です: '$TARGET_ID'"
              exit 1
            fi
            ARGS="--id $ID"
          fi
          if [ "$MODE" = "publish" ]; then
            ARGS="$ARGS --publish"
          fi
          echo "実行コマンド: python publish_urgent.py $ARGS"
          python publish_urgent.py $ARGS

      - name: 生成物アーティファクト（dry-run時のみ）
        if: github.event.inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: urgent-preview-${{ github.run_id }}
          path: urgent/scripts/_sample/
          retention-days: 7
          if-no-files-found: warn

      - name: 失敗通知（Gmail）
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          import os, smtplib
          from email.mime.text import MIMEText
          body = ('緊急告知の投稿で失敗がありました。\n'
                  '同じIDでもう一度実行すると、成功済みの媒体はとばして失敗分だけやり直します。\n\n'
                  'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = '[豊川ガイド] 緊急告知 失敗あり（要確認）'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = os.environ['GMAIL_USER']
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          "
