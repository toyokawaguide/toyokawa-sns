name: ブログ記事 → YouTube掛け合い動画 作成（手動実行・公開はしない）

# 記事の吹き出し（SWELL）を台本にして、VOICEVOX の掛け合い動画(1920×1080)を作る。
# できた動画は「Artifacts」からダウンロード → 中身を確認してから YouTube に手動アップロード。
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'WordPress 記事ID（数字）。URL で指定する場合は空に'
        required: false
      url:
        description: '記事URL（post_id が空のとき使用）'
        required: false
      limit:
        description: 'お試し用：先頭N台詞だけ作る（空なら全部）'
        required: false

jobs:
  make_video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: youtube/scripts
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: youtube/scripts/requirements.txt

      - name: 日本語フォントセットアップ（GitHub Raw 直接DL）
        run: |
          FONT_DIR=/tmp/light_fonts
          mkdir -p "$FONT_DIR"
          BASE_URL="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Bold.ttc" \
            "$BASE_URL/NotoSansCJK-Bold.ttc"
          ls -la "$FONT_DIR"
          echo "LIGHT_FONT_DIR=$FONT_DIR" >> $GITHUB_ENV

      - name: ffmpeg セットアップ（プリインストール優先・apt-getフォールバック）
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 動画作成
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          VOICEVOX_URL: http://127.0.0.1:50021
          POST_ID: ${{ inputs.post_id }}
          POST_URL: ${{ inputs.url }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=()
          if [ -n "$POST_ID" ]; then ARGS+=(--post-id "$POST_ID")
          elif [ -n "$POST_URL" ]; then ARGS+=(--url "$POST_URL")
          else echo "post_id か url を指定してください"; exit 1; fi
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          python make_video.py "${ARGS[@]}" -o ../output/video

      - name: 動画をダウンロード用に保存（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-${{ inputs.post_id || github.run_number }}
          path: |
            youtube/output/video/video.mp4
            youtube/output/video/description.txt
            youtube/output/video/thumbnail.png
            youtube/output/video/script.json
          retention-days: 14
