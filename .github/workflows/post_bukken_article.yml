name: さくっと物件紹介 配信（毎日13時 JST・キューに該当ある日のみ実行）

on:
  schedule:
    # 物件の枠＝13時。GHAのcronは遅れることがあるので保険を重ねる。
    # 二重に動いても、状態=投稿済への更新・公開済み検出・下の concurrency で二重投稿にならない。
    - cron: '0 4 * * *'    # 13:00 JST
    - cron: '20 4 * * *'   # 13:20 JST（保険）
    - cron: '40 4 * * *'   # 13:40 JST（保険）
    - cron: '0 6 * * *'    # 15:00 JST（最終保険）
  workflow_dispatch:
    inputs:
      bk_id:
        description: '対象ID（例: BK001・空ならキューの公開希望日=今日を自動選択）'
        required: false
      mode:
        description: '実行モード'
        type: choice
        options:
          - publish
          - draft
          - dry-run
        default: 'dry-run'

concurrency:
  group: sakutto-bukken-publish
  cancel-in-progress: false

jobs:
  bukken_article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: light_articles/scripts
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: light_articles/scripts/requirements.txt

      - name: 日本語フォントセットアップ（GitHub Raw 直接DL）
        run: |
          FONT_DIR=/tmp/light_fonts
          mkdir -p "$FONT_DIR"
          BASE_URL="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Bold.ttc" \
            "$BASE_URL/NotoSansCJK-Bold.ttc"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Regular.ttc" \
            "$BASE_URL/NotoSansCJK-Regular.ttc"
          echo "LIGHT_FONT_DIR=$FONT_DIR" >> $GITHUB_ENV

      - name: ffmpeg セットアップ（プリインストール優先・apt-getフォールバック）
        run: |
          if command -v ffmpeg > /dev/null; then
            echo "ffmpeg プリインストール済み"
          else
            echo "ffmpeg 未検出 → apt-get で導入"
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: OAuth credentials 復元
        run: |
          echo "${{ secrets.LIGHT_GOOGLE_CREDENTIALS_B64 }}" | base64 -d > credentials.json
          mkdir -p _assets
          echo "${{ secrets.LIGHT_GOOGLE_TOKEN_B64 }}" | base64 -d > _assets/sheets_token.json

      - name: さくっと物件紹介 配信実行
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          ID_ARG=""
          if [ -n "${{ github.event.inputs.bk_id }}" ]; then
            ID_ARG="--id ${{ github.event.inputs.bk_id }}"
          fi
          MODE_FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE_FLAGS="--publish"
          elif [ "${{ github.event.inputs.mode }}" = "publish" ]; then
            MODE_FLAGS="--publish"
          elif [ "${{ github.event.inputs.mode }}" = "draft" ]; then
            MODE_FLAGS="--draft"
          fi
          echo "実行コマンド: python publish_bukken_article.py $ID_ARG $MODE_FLAGS"
          python publish_bukken_article.py $ID_ARG $MODE_FLAGS

      - name: 生成物アーティファクト（dry-run/draft時のみ）
        if: github.event.inputs.mode == 'dry-run' || github.event.inputs.mode == 'draft'
        uses: actions/upload-artifact@v4
        with:
          name: bukken-article-preview-${{ github.run_id }}
          path: |
            light_articles/scripts/_sample/*.png
            light_articles/scripts/_sample/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 失敗通知（Gmail）
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          import os, smtplib
          from email.mime.text import MIMEText
          msg = MIMEText('さくっと物件紹介の配信ワークフローが失敗しました（中身の問題で止めた場合もここに届きます）。GitHub Actions のログを確認してください。\n\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}', 'plain', 'utf-8')
          msg['Subject'] = '[豊川ガイド] さくっと物件紹介 配信失敗'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = os.environ['GMAIL_USER']
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          "
