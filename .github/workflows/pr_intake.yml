name: さくっとPR 申込受付（30分ごと・申込があればプレビューを自動返信）

# 申込フォーム（Apps Script）が PRキュー に 状態=申込 で行を足す。
# それを拾って、記事の下書きとアイキャッチを作り、申込者へメールで送るだけ。
# ⚠️ WP には一切書き込まない（公開は post_pr_article.yml の仕事）。
on:
  schedule:
    - cron: '*/10 * * * *'    # 10分ごと（プレビューを早く届ける・2026-08-06）。申込ゼロなら「📭ありません」で即終了
  workflow_dispatch:
    inputs:
      pr_id:
        description: '対象ID（例: PR003・空なら 状態=申込 を全部処理）'
        required: false
      dry:
        description: 'メールを送らず内容だけ確認する'
        type: boolean
        default: false

concurrency:                  # 前の回が動いていたら重ねない（二重送信の防止）
  group: pr-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: light_articles/scripts
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: light_articles/scripts/requirements.txt

      - name: 日本語フォントセットアップ
        run: |
          FONT_DIR=/tmp/light_fonts
          mkdir -p "$FONT_DIR"
          BASE_URL="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Bold.ttc" "$BASE_URL/NotoSansCJK-Bold.ttc"
          curl -fsSL --retry 3 --max-time 180 \
            -o "$FONT_DIR/NotoSansCJK-Regular.ttc" "$BASE_URL/NotoSansCJK-Regular.ttc"
          echo "LIGHT_FONT_DIR=$FONT_DIR" >> $GITHUB_ENV

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: OAuth credentials 復元
        run: |
          echo "${{ secrets.LIGHT_GOOGLE_CREDENTIALS_B64 }}" | base64 -d > credentials.json
          mkdir -p _assets
          echo "${{ secrets.LIGHT_GOOGLE_TOKEN_B64 }}" | base64 -d > _assets/sheets_token.json

      # 連続失敗の回数を持ち回る（キャッシュ）。無害な失敗は緑で終わらせる方針にしたため、
      # 「前回の実行結果」では連続failureを判定できなくなった。その代わりの仕組み（2026-08-15）
      - name: 連続失敗カウンタを復元
        uses: actions/cache@v4
        with:
          path: light_articles/scripts/_intake_fail_streak
          key: pr-intake-streak-${{ github.run_id }}
          restore-keys: pr-intake-streak-

      - name: 申込の受付処理
        id: intake
        continue-on-error: true      # ← ここで即赤にしない。赤にするかは次のステップが決める
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.pr_id }}" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.pr_id }}"
          fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          echo "実行: python pr_intake.py $ARGS"
          python pr_intake.py $ARGS

      # 10分に1回×144回/日 動くので、単発の一時エラーまで知らせると通知が意味を失う。
      # 「無害な失敗」は**ジョブを緑で終わらせて**GitHub純正の失敗メールも出さない（2026-08-15）。
      #   赤にする（＝GitHubからも自作Gmailからも通知が飛ぶ）のは次のどれかだけ:
      #     (A) 実際に処理すべき申込が1件以上あった＝申込者を待たせている可能性がある
      #     (B) 失敗が6回続いた（≒1時間直っていない）＝一時エラーではなく本当に壊れている
      - name: 通知が必要か判定
        id: judge
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STREAK_FILE=_intake_fail_streak
          PREV_STREAK=$(cat "$STREAK_FILE" 2>/dev/null || echo 0)

          if [ "${{ steps.intake.outcome }}" = "success" ]; then
            echo 0 > "$STREAK_FILE"
            echo "受付処理は成功。連続失敗カウンタを 0 に戻しました"
            echo "notify=no" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT=$(cat _intake_pending_count.txt 2>/dev/null || echo "-1")
          STREAK=$((PREV_STREAK + 1))
          echo "$STREAK" > "$STREAK_FILE"
          echo "処理対象の申込件数: $COUNT（-1 = 申込を読む前に落ちた）"
          echo "連続失敗: ${STREAK}回目"

          NOTIFY=no
          if [ "$COUNT" != "0" ] && [ "$COUNT" != "-1" ]; then
            NOTIFY=yes; REASON="申込 ${COUNT}件を処理中に失敗"
          fi
          if [ "$STREAK" -ge 6 ]; then
            NOTIFY=yes; REASON="${REASON:-受付処理が失敗}（${STREAK}回連続＝約1時間直っていない）"
          fi
          echo "notify=$NOTIFY" >> $GITHUB_OUTPUT
          echo "reason=${REASON:-}" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "streak=$STREAK" >> $GITHUB_OUTPUT
          if [ "$NOTIFY" = "no" ]; then
            echo "::notice::申込ゼロの空振り回で、連続${STREAK}回目（6回未満）のため通知しません。次の回で自動復旧する想定です"
          fi

      - name: 失敗通知（Gmail）
        if: always() && steps.judge.outputs.notify == 'yes'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FAIL_REASON: ${{ steps.judge.outputs.reason }}
          PENDING_COUNT: ${{ steps.judge.outputs.count }}
        run: |
          python -c "
          import os, smtplib
          from email.mime.text import MIMEText
          body = (
              'さくっとPR 申込受付ワークフローが失敗しました。\n'
              '理由: ' + os.environ.get('FAIL_REASON', '') + '\n'
              '処理対象だった申込: ' + os.environ.get('PENDING_COUNT', '?') + '件（-1 は申込を読む前に落ちた）\n\n'
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          )
          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = '[豊川ガイド] さくっとPR 申込受付が失敗（要対応）'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = os.environ['GMAIL_USER']
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          "

      # ここで初めて赤／緑を決める。無害な失敗は緑のまま終わらせ、
      # GitHub純正の「Run failed」メールも出さない（社長への通知は本当に要る時だけ）
      - name: 結果を確定
        if: always()
        run: |
          if [ "${{ steps.intake.outcome }}" = "success" ]; then exit 0; fi
          if [ "${{ steps.judge.outputs.notify }}" = "yes" ]; then
            echo "::error::受付処理が失敗しました（要対応）: ${{ steps.judge.outputs.reason }}"
            exit 1
          fi
          echo "::warning::受付処理は失敗しましたが、申込ゼロ・連続${{ steps.judge.outputs.streak }}回目のため成功扱いにします（次の回で復旧見込み）"
          exit 0
